<!DOCTYPE html>
<html lang="en">
<head>

<meta property="og:title" content="Click me to get new surprises 💝💖">
<meta property="og:description" content="A little birthday magic made just for you 🤍">
<meta property="og:image" content="https://yourusername.github.io/birthday-surprise/images/preview.jpg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffd1dc, #fff5f8);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.15);
      max-width: 420px;
    }

    h1 {
      color: #e91e63;
      margin-bottom: 15px;
    }

    p {
      color: #555;
    }

    button {
      margin-top: 25px;
      padding: 15px 30px;
      border: none;
      border-radius: 30px;
      background: #e91e63;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.08);
      background: #d81b60;
    }
  </style>
</head>

<body>
  <div class="box">
    <h1>🎁 Click Me</h1>
    <p>I made something special just for you 💕</p>
    <button onclick="alert('Surprise page coming next 🎉')">
      Open Surprise
    </button>
  </div>
</body>
</html>
